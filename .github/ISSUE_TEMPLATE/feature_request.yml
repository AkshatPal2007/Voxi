name: Feature idea
description: Suggest a feature or improvement for Voxi.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Would you like to help build it?
