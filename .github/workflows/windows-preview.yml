name: Build Windows preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: npm.cmd run desktop:build
      - name: Package installer, notices and checksum
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Voxi-windows-x64-preview
          path: release/*-share.zip
          if-no-files-found: error
